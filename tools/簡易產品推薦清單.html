<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>快速產品推薦清單</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#f5f7f7;color:#24383e}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #46ad9c;outline-offset:2px}
.page{max-width:1480px;margin:auto;padding:24px 22px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}header h1{font-size:clamp(23px,2.6vw,31px);margin:0}
.back{background:white;border:1px solid #dce6e3;color:#126f66;text-decoration:none;border-radius:9px;padding:10px 15px;font-size:13px}
.workspace{display:flex;flex-direction:column;gap:20px}
.panel{background:white;border:1px solid #dfe7e5;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px #234b4910}
.panelhead{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:9px;border-bottom:1px solid #edf0ef}
.panelhead h2{margin:0;font-size:18px}.minor{font-size:13px;color:#72868b}
.searchbox{padding:14px 20px 3px}.searchbox input{width:100%;border:1px solid #cddbd8;border-radius:10px;padding:13px 15px;font-size:15px;outline-color:#21907e}
.searchinfo{font-size:12px;color:#789093;margin:9px 0 5px}
.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start;padding:15px 20px 20px;max-height:460px;overflow-y:auto;overscroll-behavior:contain}
.productOption{display:flex;align-items:center;gap:13px;min-height:95px;padding:15px 18px;border:1px solid #dce6e3;border-radius:11px;cursor:pointer;background:white}
.productOption:hover{background:#f7fcfa;border-color:#75b9ad}.productOption.chosen{background:#eaf9f4;border-color:#138878}
.productOption input{appearance:none;flex-shrink:0;width:25px;height:25px;border:2px solid #a7bcb8;border-radius:6px;margin:0;position:relative;cursor:pointer}
.productOption input:checked{background:#168473;border-color:#168473}.productOption input:checked:after{content:"✓";position:absolute;left:3px;top:-4px;color:#fff;font-size:18px;font-weight:800}
.productText{min-width:0;flex:1}.productName{display:block;font-weight:750;font-size:15px;line-height:1.5;overflow-wrap:anywhere}.productBrand{display:block;font-size:12px;color:#73868b;margin-top:5px}
.emptySearch{grid-column:1/-1;text-align:center;padding:30px;color:#829094}
.preview-intro{padding:18px 20px 0}.preview-intro h3{font-size:20px;margin:0}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;padding:17px 20px 22px;align-items:stretch}
.item{min-width:0;background:white;border:1px solid #dfe7e6;border-radius:12px;padding:17px;display:flex;flex-direction:column;gap:14px}
.itemtop{display:flex;align-items:flex-start;gap:14px}
.itemphoto{width:112px;height:112px;flex:0 0 112px;border-radius:10px;background:#f1f5f4;border:1px solid #edf0f1;display:grid;place-items:center;overflow:hidden;font-size:12px;color:#91a2a7;text-align:center}
.itemphoto img{width:100%;height:100%;object-fit:contain;background:#fff}
.iteminfo{flex:1;min-width:0}.itemname{font-size:17px;line-height:1.5;font-weight:750;margin:4px 0 9px;overflow-wrap:anywhere}.itembrand{color:#7b8b90;font-size:12px;margin:0}
.itemprice{font-size:14px;color:#206d63;font-weight:700}
.itemremove{align-self:flex-start;border:0;border-radius:7px;background:#f7f9f8;color:#7b8b90;padding:5px 9px;font-size:12px;white-space:nowrap}
.itemremove:hover{color:#ad5555;background:#fff0f0}
.descriptionwrap{display:flex;flex-direction:column;gap:8px}
.desclabelrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.editlabel{font-size:13px;font-weight:700;color:#526a70}
.resetdesc{border:0;background:transparent;color:#157d70;font-size:12px;padding:3px}
.itemdesc{width:100%;min-height:88px;resize:vertical;border:1px solid #d9e3e0;border-radius:9px;background:#fbfdfc;padding:10px 12px;font-size:13px;line-height:1.6;color:#354f54}
.previewempty{grid-column:1/-1;text-align:center;padding:65px 20px;color:#738689}
.footerbar{padding:15px 20px;background:#fbfdfc;border-top:1px solid #e7edeb}
.actions{display:flex;flex-wrap:wrap;gap:9px}
.btn{border:1px solid #c6d8d5;border-radius:9px;background:white;color:#206b60;font-weight:700;font-size:14px;padding:11px 16px;min-height:43px}
.btn.main{background:#137a6e;color:#fff;border-color:#137a6e}.btn.image{background:#e9f7f2;color:#116f63;border-color:#a9d8c9}.btn.quiet{background:#f7faf9;color:#627d7e}
.cloud{font-size:12px;margin:10px 0 0;color:#77898b}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#203f42;color:#fff;border-radius:9px;display:none;z-index:5}
@media(max-width:1080px){.picker{grid-template-columns:repeat(2,minmax(0,1fr))}.itemphoto{width:95px;height:95px;flex-basis:95px}.itemtop{gap:10px}}
@media(max-width:770px){.items{grid-template-columns:1fr}.page{padding:18px 12px 45px}.picker{max-height:400px;padding:13px}.panelhead{padding:15px}.searchbox{padding:14px 13px 4px}.items{padding:14px}.itemphoto{width:110px;height:110px;flex-basis:110px}}
@media(max-width:540px){header{flex-wrap:wrap}.picker{grid-template-columns:1fr;max-height:395px}.productOption{min-height:72px;padding:12px}.item{padding:13px}.itemphoto{width:80px;height:80px;flex-basis:80px}.itemname{font-size:15px}.btn{flex:1}}
</style>
</head>
<body>
<div class="page">
<header>
  <div><h1>快速產品推薦清單</h1></div>
  <a class="back" href="/image-review/">圖片核對中心</a>
</header>
<main class="workspace">
<section class="panel pickerpanel" aria-label="勾選產品">
  <div class="panelhead"><h2>勾選產品</h2><span class="minor" id="catalogCount">載入中</span></div>
  <div class="searchbox">
    
    <input id="productSearch" type="search" placeholder="例如：OPC、維生素 C" autocomplete="off">
    <p class="searchinfo" id="filterCount"></p>
  </div>
  <div class="picker" id="productPicker"></div>
</section>
<section class="panel preview" aria-label="推薦單預覽">
  <div class="panelhead"><h2>推薦清單</h2><span class="minor" id="selectedCount">已選 0 項</span></div>
  <div class="preview-intro"><h3>為您推薦的產品</h3></div>
  <div class="items" id="selectedItems"><div class="previewempty">勾選上方產品，這裡會顯示推薦清單。</div></div>
  <div class="footerbar">
    <div class="actions">
      <button class="btn main" type="button" id="exportHTML" disabled>下載推薦單</button>
      <button class="btn image" type="button" id="exportPNG" disabled>下載圖片 PNG</button>
      <button class="btn" type="button" id="copyList" disabled>複製文字</button>
      <button class="btn quiet" type="button" id="clearList" disabled>清空</button>
    </div>
    <p class="cloud" id="cloudStatus" role="status">正在讀取已核准的雲端圖片…</p>
    <p class="cloud">PNG 採單欄橫式排列；清單較長時會下載包含多張圖片的 ZIP。</p>
  </div>
</section>
</main>
</div>
<div id="toast" role="status"></div>
<script src="/recommendation-list/catalog.js"></script>
<script src="/recommendation-list/png-export.js"></script>
<script src="/recommendation-list/simple-list.js"></script>
</body>
</html>
